services:
  distro-kid-api:
    build:
      context: ..
      dockerfile: DistroKid.Deployment/Dockerfile
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_URLS: "http://+:5001"
      ConnectionStrings__WebAppDatabase: "Server=distro-kid-db;Port=5432;Database=distro-kid;User Id=distro-kid;Password=distro-kid;"
    depends_on:
      - distro-kid-db

  distro-kid-db:
    image: postgres:13.2-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: distro-kid
      POSTGRES_DB: distro-kid
      POSTGRES_PASSWORD: distro-kid
    volumes:
      - distro-kid-db-vol:/var/lib/postgresql/data

volumes:
  distro-kid-db-vol:
